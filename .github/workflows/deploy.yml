# Runs only on a version tag push, which the release skill creates after
# explicit confirmation — a plain push to main never deploys. The test job
# runs first; fly deploy happens only if everything is fine.
name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Build, vet, test, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
