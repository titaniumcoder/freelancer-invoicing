name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency: release-group

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release
        id: prep
        run: python3 .github/scripts/prepare_release.py

      - name: Commit changelog, push tag
        if: steps.prep.outputs.skip != 'true'
        run: |
          git config user.name "release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): v${{ steps.prep.outputs.version }}"
          git push
          git tag "v${{ steps.prep.outputs.version }}"
          git push origin "v${{ steps.prep.outputs.version }}"

      - name: Create GitHub release
        if: steps.prep.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.prep.outputs.version }}" \
            --title "v${{ steps.prep.outputs.version }}" \
            --notes-file release-notes.md
